<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="css/contact.css">
  <link rel="stylesheet" href="css/nav.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title> 
</head>


<body>
  <header>
    <a href="#" class="logo"> Olivia</a> 

    <nav>
      <a href = "../index.html">About Me</a>
      <a href= "https://www.linkedin.com/in/oliviabogle2025">LinkedIn</a> 
      <a href= "https://www.tiktok.com/explore">Favorite Social</a>
      <a href= "../cssProjects/index.html">CSS Projects</a>
      <span></span>
    </nav>
  </header>


  <form id="contactForm">
      <h1>Contact Me</h1>

      <label for="name">Name:</label>
      <input type="text" id="name" placeholder="Your name">
      <small class="error"></small>

      <label for="email">Email:</label>
      <input type="text" id="email" placeholder="Your email">
      <small class="error"></small>

      <label for="message">Message:</label>
      <textarea id="message" placeholder="Your message" rows="6"></textarea>
      <small class="error"></small>

      <div class="center">
          <input type="submit" value="Send Message">
          <p id="success"></p>
      </div>

      <!-- Table container -->
      <div id="resultContainer" style="display:none;">  
        <h2>Submitted!</h2>  
        <table id="resultTable" border="1">    
          <thead>      
            <tr>        
              <th>Information</th>        
              <th>Response</th>         
            </tr>
          </thead>    
          <tbody></tbody>  
        </table>
      </div>
  
  </form>

  

  
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

      emailjs.init("QmIfSPqlZpk1nVGMt"); // my EmailJS public key

</body>
